<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Oracle of the Harpies</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      text-align: center;
      background: #111;
      color: #eee;
    }

    img {
      max-width: 500px;
      width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }

    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .keywords {
      font-style: italic;
      opacity: .8;
    }
    .spread {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 20px;
margin-top: 30px;
}

.pos3 {
grid-column: 2;
}

.pos2 {
grid-column: 1;
}

.pos4 {
grid-column: 3;
}

.pos1 {
grid-column: 2;
}

.pos5 {
grid-column: 2;
}

.flock-card {
text-align: center;
}

.flock-card img {
width: 180px;
max-width: 100%;
}

#reading p {
  line-height: 1.6;
}

.harpy-reading {
  margin-top: 2rem;
  padding: 1.5rem;
  border: 1px solid #444;
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
}
.modal {
display: none;
position: fixed;
z-index: 1000;
left: 0;
top: 0;
width: 100%;
height: 100%;

background: rgba(0,0,0,.85);
}

.modal-content {
max-width: 900px;
margin: 40px auto;
background: #111;
padding: 20px;
border-radius: 12px;
}

.modal-content img {
width: 100%;
max-width: 600px;
}

.close {
float: right;
font-size: 32px;
cursor: pointer;
}

  </style>
</head>

<body>

<h1>The Oracle of the Harpies</h1>

<button onclick="drawCard()">Draw a Card</button>
<button onclick="drawFlock()">The Flock Spread</button>

<div id="cardModal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">&times;</span>

    <div id="modalBody"></div>

  </div>

</div>

<div id="reading"></div>

<script>
let cards = [];

fetch("cards.json")
  .then(r => r.json())
  .then(data => cards = data);

function drawCard() {

  const card = cards[Math.floor(Math.random() * cards.length)];

  document.getElementById("reading").innerHTML = `
    <h2>${card.title}</h2>

    <img src="images/${card.image}" alt="${card.title}">

    <p class="keywords">
      ${card.keywords.join(" • ")}
    </p>

    <h3>Oracle</h3>

    <p>${card.oracle}</p>

    <h3>Meaning</h3>

    <p>${card.meaning}</p>
  `;
}
function shuffle(array) {
return [...array].sort(() => Math.random() - 0.5);
}

function drawFlock() {
  const flock = shuffle(cards).slice(0, 5);

  document.getElementById("reading").innerHTML = `
    <h2>The Flock Spread</h2>

    <div class="spread">
      <div class="flock-card pos3">
        <h3>3 — What Watches Over You</h3>
        <img src="images/${flock[2].image}" alt="${flock[2].title}" onclick='openCard(${JSON.stringify(flock[2])})'>

        <p>${flock[2].title}</p>
      </div>

      <div class="flock-card pos2">
        <h3>2 — What Was Lost</h3>
        <img src="images/${flock[1].image}" alt="${flock[1].title}" onclick='openCard(${JSON.stringify(flock[1])})'>
        <p>${flock[1].title}</p>
      </div>

      <div class="flock-card pos4">
        <h3>4 — What Must Be Reclaimed</h3>
        <img src="images/${flock[3].image}" alt="${flock[3].title}" onclick='openCard(${JSON.stringify(flock[3])})'>
        <p>${flock[3].title}</p>
      </div>

      <div class="flock-card pos1">
        <h3>1 — The Wound</h3>
        <img src="images/${flock[0].image}" alt="${flock[0].title}">
        <p>${flock[0].title}</p>
      </div>

      <div class="flock-card pos5">
        <h3>5 — The Harpy's Gift</h3>
        <img src="images/${flock[4].image}" alt="${flock[4].title}" onclick='openCard(${JSON.stringify(flock[4])})'>
        <p>${flock[4].title}</p>
      </div>
    </div>

    <hr>

    <div class="harpy-reading">

<h2>The Harpies Say</h2>

<p>${generateReading(flock)}</p>

</div>
  `;
}
function openCard(card) {

document.getElementById("modalBody").innerHTML = ` <h2>${card.title}</h2>

<img src="images/${card.image}" alt="${card.title}">

<p><em>${card.keywords.join(" • ")}</em></p>

<h3>Oracle</h3>

<p>${card.oracle}</p>

<h3>Meaning</h3>

<p>${card.meaning}</p>

`;

document.getElementById("cardModal").style.display = "block";
}

function closeModal() {
document.getElementById("cardModal").style.display = "none";
}

function generateReading(flock) {
  return `
    You are moving through a period of transformation.

    ${flock[0].title} reveals the central wound asking for your attention.

    ${flock[1].title} suggests something valuable has been lost, forgotten, or taken from you.

    Yet ${flock[2].title} appears as a guide, reminding you that support is present even when it cannot be clearly seen.

    ${flock[3].title} points toward the strength, truth, or capacity that is ready to be reclaimed.

    Finally, ${flock[4].title} emerges as the Harpy's Gift: the wisdom carried forward from this experience.

    The Harpies do not promise justice.

    They remind us that restoration remains possible, even when justice never arrived.
  `;
}

</script>

</body>
</html>
