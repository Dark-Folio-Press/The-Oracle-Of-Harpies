    /* ── Header ── */

      border-bottom: 1px solid var(--border-gold);
      margin-bottom: 2.5rem;

    .site-header::before,

      font-size: 1.2rem;

    .site-header h1 {

      margin-bottom: 0.6rem;

      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }

    .star-divider {
      color: var(--gold-dim);
      font-size: 0.9rem;
      letter-spacing: 0.5em;
      margin-top: 1rem;
    }

.pearl-footer {

  border-radius: 10px;

  background: rgba(201,168,76,0.04);

  text-align: center;
}

.pearl-footer h3 {
  font-family: 'Cinzel Decorative', serif;

  color: var(--gold);

  font-size: 1rem;

  margin-bottom: 1rem;

  text-transform: none;

  letter-spacing: 0.05em;
}

.pearl-footer p {
  color: var(--gold-light);

  font-style: italic;

  line-height: 1.8;

  text-align: center;
}

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    button {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(123,63,160,0.08));
      opacity: 0;
      transition: opacity 0.25s;
    }

    button:hover {
      color: var(--gold-light);
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 20px rgba(201,168,76,0.05);
    }
    button:hover::before { opacity: 1; }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .landing-image {
  text-align: center;
  margin: 2rem auto 3rem;
}

.landing-image img {
  width: 100%;
  max-width: 900px;
  height: auto;
  display: block;
  margin: 0 auto;
  border-radius: 8px;
  border: 1px solid var(--border-gold);
  box-shadow:
    0 8px 40px rgba(0,0,0,0.6),
    0 0 30px rgba(201,168,76,0.15);
}

      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;

    #reading h2 {
      font-family: 'Cinzel Decorative', serif;

      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);

    #reading h3 {
      font-family: 'Cinzel', serif;
      color: var(--teal);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;

      max-width: 340px;
      width: 100%;

      border-radius: 6px;
      border: 1px solid var(--border);

    #reading p {
  line-height: 1.55;
  color: var(--white);
  font-size: 1.05rem;
  text-align: center;
}

    .keywords {
      font-style: italic;
      color: var(--teal);
      opacity: 0.9;
      letter-spacing: 0.05em;
    }

    /* ── Flock spread ── */
    .spread {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin: 1.5rem 0;
}

    .flock-card {
      text-align: center;
      padding: 0.75rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(15,15,34,0.7);
      transition: border-color 0.2s, box-shadow 0.2s;

    .flock-card:hover {
      border-color: rgba(201,168,76,0.4);
      box-shadow: 0 0 20px rgba(201,168,76,0.1);
    }

    .flock-card h3 {

      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.6rem;
      text-align: center;

      width: 150px;
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 0 auto 0.5rem;
      display: block;

    .flock-card img:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(123,63,160,0.3);

      font-size: 0.7rem;
      color: var(--gold-light);
      letter-spacing: 0.05em;
      margin-top: 0.4rem;

    .nest {

      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 1rem;
      background: linear-gradient(135deg, rgba(201,168,76,0.05), rgba(123,63,160,0.07));

      font-size: 0.85rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .nest h4 {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--teal);
      text-align: center;
      margin-bottom: 0.75rem;

      font-size: 0.82rem;
      color: var(--white-dim);
      line-height: 1.6;
      margin-bottom: 0.6rem;
      text-align: left;
    }

      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--coral);
      display: block;
      margin-bottom: 0.2rem;
    }

    /* ── Harpy reading ── */
    .harpy-reading p {
  white-space: pre-line;
  text-align: left;
  line-height: 1.55;
  color: var(--white);
  font-size: 1rem;
  max-width: 68ch;
  margin: 0 auto;
}

    .harpy-reading::before {
  content: '✦';
  position: absolute;
  top: -0.7rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  padding: 0 0.75rem;
  color: var(--gold);
  font-size: 1rem;
}

    .harpy-reading h2 {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold);
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }

    .harpy-reading p {
      white-space: pre-line;
      text-align: left;
      line-height: 2;
      color: var(--white);
      font-size: 1rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ── Modal ── */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      margin: 3vh auto;
      background: linear-gradient(160deg, #0f0f22, #12122a);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 2rem;
      position: relative;
    }

    .modal-content h2 {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold);
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .modal-content h3 {
      font-family: 'Cinzel', serif;
      color: var(--teal);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .modal-content p {
      color: var(--white);
      line-height: 1.75;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .modal-content em {
      color: var(--white-dim);
      font-style: italic;
    }

    .modal-content img {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      margin: 1.25rem auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }

    .close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--gold-dim);
      line-height: 1;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      font-family: serif;
    }
    .close:hover { color: var(--gold); border: none; box-shadow: none; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
  .spread {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .spread {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>

// ─── Reading generator ───────────────────────────────────────────────────────

function generateReading(flock) {
  const pm0 = positionMeanings[flock[0].title];
  const pm1 = positionMeanings[flock[1].title];
  const pm2 = positionMeanings[flock[2].title];
  const pm3 = positionMeanings[flock[3].title];
  const pm4 = positionMeanings[flock[4].title];

  const wound   = pm0?.wound   || `${flock[0].title} names the central wound — the place that is asking for your honest attention.`;
  const loss    = pm1?.loss    || `${flock[1].title} suggests something valuable has been lost, forgotten, abandoned, or taken from you.`;
  const guide   = pm2?.guide   || `${flock[2].title} appears as guide and witness — a reminder that support is present even when it cannot be clearly seen.`;
  const reclaim = pm3?.reclaim || `${flock[3].title} points toward the strength, truth, or capacity that is now ready to be reclaimed.`;
  const gift    = pm4?.gift    || `${flock[4].title} emerges as the Harpy\u2019s Gift: the wisdom carried forward from this experience.`;

  const woundLoss   = relationships[`${flock[0].title}|${flock[1].title}`] || relationships[`${flock[1].title}|${flock[0].title}`] || "";
  const guideReclaim = relationships[`${flock[2].title}|${flock[3].title}`] || relationships[`${flock[3].title}|${flock[2].title}`] || "";

  return [
    wound,
    loss,
    woundLoss,
    guide,
    reclaim,
    guideReclaim,
    gift,
    
  ].filter(Boolean).join("\n\n");
}
