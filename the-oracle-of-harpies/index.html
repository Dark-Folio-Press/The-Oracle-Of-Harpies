<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Oracle of the Harpies</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      text-align: center;
      background: #111;
      color: #eee;
    }

    img {
      max-width: 500px;
      width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }

    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .keywords {
      font-style: italic;
      opacity: .8;
    }
    .spread {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 20px;
margin-top: 30px;
}

.pos3 {
grid-column: 2;
}

.pos2 {
grid-column: 1;
}

.pos4 {
grid-column: 3;
}

.pos1 {
grid-column: 2;
}

.pos5 {
grid-column: 2;
}

.flock-card {
text-align: center;
}

.flock-card img {
width: 180px;
max-width: 100%;
}

  </style>
</head>

<body>

<h1>The Oracle of the Harpies</h1>

<button onclick="drawCard()">Draw a Card</button>
<button onclick="drawFlock()">The Flock Spread</button>

<div id="reading"></div>

<script>
let cards = [];

fetch("cards.json")
  .then(r => r.json())
  .then(data => cards = data);

function drawCard() {

  const card = cards[Math.floor(Math.random() * cards.length)];

  document.getElementById("reading").innerHTML = `
    <h2>${card.title}</h2>

    <img src="images/${card.image}" alt="${card.title}">

    <p class="keywords">
      ${card.keywords.join(" • ")}
    </p>

    <h3>Oracle</h3>

    <p>${card.oracle}</p>

    <h3>Meaning</h3>

    <p>${card.meaning}</p>
  `;
}
function shuffle(array) {
return [...array].sort(() => Math.random() - 0.5);
}

function drawFlock() {

const flock = shuffle(cards).slice(0, 5);

document.getElementById("reading").innerHTML = `
<h2>The Flock Spread</h2>

<div class="spread">

  <div class="flock-card pos3">
    <h3>What Watches Over You</h3>
    <img src="images/${flock[2].image}" alt="${flock[2].title}">
    <p>${flock[2].title}</p>
  </div>

  <div class="flock-card pos2">
    <h3>What Was Lost</h3>
    <img src="images/${flock[1].image}" alt="${flock[1].title}">
    <p>${flock[1].title}</p>
  </div>

  <div class="flock-card pos4">
    <h3>What Must Be Reclaimed</h3>
    <img src="images/${flock[3].image}" alt="${flock[3].title}">
    <p>${flock[3].title}</p>
  </div>

  <div class="flock-card pos1">
    <h3>The Wound</h3>
    <img src="images/${flock[0].image}" alt="${flock[0].title}">
    <p>${flock[0].title}</p>
  </div>

  <div class="flock-card pos5">
    <h3>The Harpy's Gift</h3>
    <img src="images/${flock[4].image}" alt="${flock[4].title}">
    <p>${flock[4].title}</p>
  </div>

</div>
`;
}


</script>

</body>
</html>
