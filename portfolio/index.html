<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oracle of the Harpies</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a0d1a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --teal: #6ab3c0;
    --parchment: #f5f0e8;
    --ink: #1a1228;
  }

  body {
    background: var(--navy);
    font-family: 'EB Garamond', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--parchment);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 73% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 67%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 62% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(2px 2px at 30% 35%, rgba(201,168,76,0.3) 0%, transparent 100%),
      radial-gradient(2px 2px at 90% 30%, rgba(106,179,192,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2.5rem 1rem 1rem;
  }

  header h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 3vw, 1.8rem);
    color: var(--gold);
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(201,168,76,0.4);
  }

  header p {
    font-style: italic;
    color: var(--teal);
    font-size: 0.95rem;
    margin-top: 0.4rem;
    opacity: 0.85;
  }

  .site-footer {
  margin: 3rem 0 2rem;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1.5rem;
  text-align: center;
}

.footer-link {
  color: var(--gold);
  text-decoration: none;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.05em;
  transition: opacity 0.3s ease;
}

.footer-link:hover {
  opacity: 0.75;
}

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 900px;
    padding: 1rem 1.5rem 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-wrap {
    flex: 0 0 auto;
    width: clamp(240px, 45vw, 420px);
    position: relative;
    perspective: 1000px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(201,168,76,0.35);
    box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 60px rgba(201,168,76,0.08);
  }

  .card-face img {
    width: 100%;
    display: block;
  }

  .card-back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #0f1526 0%, #1a1228 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    gap: 0.8rem;
  }

  .card-back .num {
    font-family: 'Cinzel Decorative', serif;
    font-size: 2rem;
    color: var(--gold);
    opacity: 0.6;
  }

  .card-back .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1rem;
    color: var(--gold-light);
    letter-spacing: 0.06em;
  }

  .card-back .kw {
    font-style: italic;
    color: var(--teal);
    font-size: 0.85rem;
  }

  .card-back .divider {
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }

  .card-back .body {
    font-size: 0.88rem;
    color: rgba(245,240,232,0.8);
    line-height: 1.6;
  }

  .card-back .oracle {
    font-style: italic;
    color: var(--gold-light);
    font-size: 0.9rem;
    margin-top: 0.4rem;
  }

  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem 0.5rem;
  }

  .btn {
    background: transparent;
    border: 1px solid rgba(201,168,76,0.5);
    color: var(--gold);
    font-family: 'EB Garamond', serif;
    font-size: 0.9rem;
    padding: 0.45rem 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.04em;
  }

  .btn:hover { background: rgba(201,168,76,0.12); border-color: var(--gold); }
  .btn.active { background: rgba(201,168,76,0.18); border-color: var(--gold-light); color: var(--gold-light); }

  .btn-nav {
    font-size: 1.2rem;
    padding: 0.35rem 1rem;
    border-color: rgba(106,179,192,0.4);
    color: var(--teal);
  }

  .btn-nav:hover { background: rgba(106,179,192,0.1); border-color: var(--teal); }
  .btn-nav:disabled { opacity: 0.25; cursor: default; }

  .speed-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: rgba(255,255,255,0.4);
    font-size: 0.82rem;
  }

  .speed-wrap input {
    accent-color: var(--gold);
    width: 80px;
  }

  .progress-bar {
    position: relative;
    z-index: 1;
    width: calc(100% - 3rem);
    max-width: 900px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin: 0.8rem auto 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    transition: width 0.4s ease;
    border-radius: 2px;
  }

  .flip-hint {
    position: relative;
    z-index: 1;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    font-style: italic;
    padding: 0.5rem 0 1rem;
    text-align: center;
  }

  @media (max-width: 600px) {
    .card-wrap { width: clamp(240px, 80vw, 340px); }
  }
</style>
</head>
<body>

<header>
  <h1>The Oracle of the Harpies</h1>
  <p>Dark Folio Press &mdash; tap a card to reveal its meaning</p>
</header>

<footer class="site-footer">
  <a href="../" class="footer-link">
    ◈ Experience The Interactive Oracle
  </a>

   <a href="https://suno.com/s/9nDZX3gBcetUothP/" target="_blank">
    ♫ Listen to the Soundtrack
  </a>

    <a href="https://horoscopes.darkfoliopress.com/" target="_blank" class="footer-link">
    Daily Horoscopes
  </a>

  <a href="https://oracle.darkfoliopress.com" target="_blank" class="footer-link">
    Daily Planetary Ephemeris with a little magic sprinkled in
  </a>

  <a href="https://www.darkfoliopress.com" target="_blank" class="footer-link">
    Dark Folio Press
  </a>

</footer>

<div class="stage">
  <div class="card-wrap">
    <div class="card-inner" id="cardInner" onclick="flipCard()">
      <div class="card-face" id="cardFront">
        <img id="cardImg" src="" alt="">
      </div>
      <div class="card-face card-back" id="cardBack">
        <div class="num" id="bNum"></div>
        <div class="title" id="bTitle"></div>
        <div class="kw" id="bKw"></div>
        <div class="divider"></div>
        <div class="body" id="bBody"></div>
        <div class="oracle" id="bOracle"></div>
      </div>
    </div>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="flip-hint">Click the card to flip · reveal meaning on back</div>

<div class="controls">
  <button class="btn btn-nav" id="btnPrev" onclick="navigate(-1)">&#8592;</button>
  <button class="btn" id="btnPlay" onclick="togglePlay()">&#9654; Auto-play</button>
  <button class="btn btn-nav" id="btnNext" onclick="navigate(1)">&#8594;</button>
  <div class="speed-wrap">
    <span>Speed</span>
    <input type="range" id="speedSlider" min="1" max="10" value="4" oninput="updateSpeed()">
    <span id="speedLabel">4s</span>
  </div>
  <button class="btn" onclick="flipCard()">&#8635; Flip</button>
</div>

<script>
  let cards = [];
  let current = 0;
  let isFlipped = false;
  let isPlaying = false;
  let intervalId = null;
  let speed = 4000;

  Papa.parse("data/harpy_cards_meanings.csv", {
    download: true,
    header: true,
    complete: function(results) {
      cards = results.data.filter(r => r.number !== undefined && r.number !== '');
      console.log("Loaded cards:", cards.length, cards[0]);
      render(0, false);
    },
    error: function(err) {
      console.error("CSV load failed:", err);
    }
  });

  function render(idx, animate) {
    const c = cards[idx];
    if (!c) return;

    isFlipped = false;
    document.getElementById('cardInner').classList.remove('flipped');

    const filename =
      String(c.number).padStart(2, '0') + '-' +
      c.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') +
      '.png';

    document.getElementById('cardImg').src = `images/${filename}`;
    document.getElementById('cardImg').alt = c.title;

    document.getElementById('bNum').textContent = c.number;
    document.getElementById('bTitle').textContent = c.title;
    document.getElementById('bKw').textContent = c.keywords;
    document.getElementById('bBody').textContent = c.meaning;
    document.getElementById('bOracle').textContent = '\u201c' + c.oracle + '\u201d';

    document.getElementById('progressFill').style.width = ((idx + 1) / cards.length * 100) + '%';
    document.getElementById('btnPrev').disabled = idx === 0;
    document.getElementById('btnNext').disabled = idx === cards.length - 1;
  }

  function flipCard() {
    isFlipped = !isFlipped;
    document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
  }

  function navigate(dir) {
    const next = current + dir;
    if (next < 0 || next >= cards.length) return;
    current = next;
    render(current, true);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('btnPlay');
    if (isPlaying) {
      btn.textContent = '\u23f8 Pause';
      btn.classList.add('active');
      startAutoPlay();
    } else {
      btn.textContent = '\u25b6 Auto-play';
      btn.classList.remove('active');
      clearInterval(intervalId);
    }
  }

  function startAutoPlay() {
    clearInterval(intervalId);
    intervalId = setInterval(() => {
      let next = current + 1;
      if (next >= cards.length) next = 0;
      current = next;
      render(current, true);
    }, speed);
  }

  function updateSpeed() {
    const val = parseInt(document.getElementById('speedSlider').value);
    speed = val * 1000;
    document.getElementById('speedLabel').textContent = val + 's';
    if (isPlaying) startAutoPlay();
  }
</script>
</body>
</html>
